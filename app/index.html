<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme-gardevoir.css">
</head>
<body>
  <!-- Theme backdrop (hidden unless CONFIG.theme turns a theme on). -->
  <div id="theme">
    <div class="aurora"></div>
    <!-- Gardevoir emblem: white face and gown, mint bob with long side locks, ruby chest horn. -->
    <svg id="emblem" viewBox="0 0 600 800">
      <defs>
        <linearGradient id="gvHair" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#9ff0c8"/><stop offset="1" stop-color="#2f9e74"/>
        </linearGradient>
        <linearGradient id="gvGown" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f3f7f4" stop-opacity="0.7"/><stop offset="1" stop-color="#f3f7f4" stop-opacity="0.08"/>
        </linearGradient>
        <linearGradient id="gvRuby" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ff8a9b"/><stop offset="1" stop-color="#b8233e"/>
        </linearGradient>
      </defs>
      <circle cx="300" cy="420" r="290" fill="none" stroke="#7ee0b2" stroke-opacity="0.22" stroke-width="2"/>
      <circle cx="300" cy="420" r="250" fill="none" stroke="#7ee0b2" stroke-opacity="0.12" stroke-width="1.5" stroke-dasharray="4 14"/>
      <!-- gown, flaring from the waist into a scalloped hem -->
      <path fill="url(#gvGown)" d="M272 420C232 500 172 590 120 720C170 700 210 740 255 705C280 745 320 745 345 705C390 740 430 700 480 720C428 590 368 500 328 420Z"/>
      <!-- torso and arms -->
      <path fill="#f3f7f4" fill-opacity="0.75" d="M286 262L314 262L330 424L270 424Z"/>
      <path fill="#f3f7f4" fill-opacity="0.65" d="M282 298C242 330 222 382 214 452C222 454 228 450 232 444C238 392 254 348 290 320Z"/>
      <path fill="#f3f7f4" fill-opacity="0.65" d="M318 298C358 330 378 382 386 452C378 454 372 450 368 444C362 392 346 348 310 320Z"/>
      <!-- face -->
      <ellipse cx="300" cy="215" rx="58" ry="66" fill="#f3f7f4" fill-opacity="0.9"/>
      <!-- hair: bob over the head, then long locks falling past the shoulders -->
      <path fill="url(#gvHair)" d="M300 112C215 112 176 170 180 240C182 270 194 298 210 318L232 252C242 212 266 188 300 186C334 188 358 212 368 252L390 318C406 298 418 270 420 240C424 170 385 112 300 112Z"/>
      <path fill="url(#gvHair)" d="M212 300C190 360 198 420 240 472C230 420 232 370 250 322Z"/>
      <path fill="url(#gvHair)" d="M388 300C410 360 402 420 360 472C370 420 368 370 350 322Z"/>
      <!-- ruby chest horn -->
      <path fill="url(#gvRuby)" d="M300 318C317 350 323 382 300 432C277 382 283 350 300 318Z"/>
    </svg>
    <span class="sparkle" style="left:1180px;top:140px;animation-delay:0s"></span>
    <span class="sparkle ruby" style="left:1690px;top:250px;animation-delay:1.2s"></span>
    <span class="sparkle" style="left:1420px;top:520px;animation-delay:2.1s"></span>
    <span class="sparkle" style="left:1800px;top:610px;animation-delay:3.3s"></span>
    <span class="sparkle ruby" style="left:980px;top:330px;animation-delay:0.7s"></span>
    <span class="sparkle" style="left:760px;top:180px;animation-delay:2.8s"></span>
    <span class="sparkle" style="left:240px;top:470px;animation-delay:1.7s"></span>
    <span class="sparkle ruby" style="left:520px;top:600px;animation-delay:3.9s"></span>
    <span class="sparkle" style="left:1560px;top:90px;animation-delay:4.2s"></span>
    <span class="sparkle" style="left:1100px;top:640px;animation-delay:0.4s"></span>
  </div>

  <!-- Ambient glow in the colour of the focused dock app; two layers so colours crossfade. -->
  <div id="ambientA" class="ambient"></div>
  <div id="ambientB" class="ambient"></div>

  <!-- Top shelf: the focused dock app's name, above the dock. -->
  <div id="hero"></div>

  <header>
    <div id="leftBlock">
      <div id="greeting"></div>
      <div id="timeRow">
        <span id="clock"></span><span id="ampm"></span><span class="divider"></span><span id="date"></span>
      </div>
    </div>
    <div id="topButtons">
      <div class="pill" id="btnInputs">
        <svg viewBox="0 0 24 24"><path d="M18,7V4c0,-1.1 -0.9,-2 -2,-2H8C6.9,2 6,2.9 6,4v3H5v6l3,6v3h8v-3l3,-6V7H18zM8,4h8v3h-2V5h-1v2h-2V5h-1v2H8V4z"/></svg>
        <span>Inputs</span>
      </div>
      <div class="pill" id="btnWifi">
        <svg viewBox="0 0 24 24"><path d="M1,9l2,2c4.97,-4.97 13.030,-4.97 18,0l2,-2C16.93,2.93 7.08,2.93 1,9zM9,17l3,3 3,-3c-1.65,-1.66 -4.34,-1.66 -6,0zM5,13l2,2c2.76,-2.76 7.24,-2.76 10,0l2,-2C15.14,9.14 8.87,9.14 5,13z"/></svg>
        <span id="wifiLabel">Wi-Fi</span>
      </div>
      <div class="pill" id="btnSettings">
        <svg viewBox="0 0 24 24"><path d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.030,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.030,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.030,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
        <span>Settings</span>
      </div>
    </div>
  </header>

  <!-- Everything below the header scrolls together: dock band, tiles and the glass highlight. -->
  <div id="viewport">
    <div id="stage">
      <div id="dockBand"></div>
      <div id="tiles"></div>
      <div id="glass"></div>
    </div>
  </div>

  <!-- Dropdown under the Inputs pill. -->
  <div id="inputsPanel" class="hidden"></div>

  <div id="toast"></div>

  <script src="config.js"></script>
  <script src="apps.js"></script>
  <script src="app.js"></script>
</body>
</html>
