<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Router</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div id="title">
      <span id="host">Router</span><span id="role" class="pill"></span>
    </div>
    <div id="right">
      <span id="status"></span><span id="clock"></span>
    </div>
  </header>

  <!-- One row of single-number cards. -->
  <div id="cards">
    <div class="card" id="cWan"><div class="label">WAN</div><div class="value"></div><div class="sub"></div></div>
    <div class="card" id="cWan6"><div class="label">WAN6</div><div class="value"></div><div class="sub"></div></div>
    <div class="card" id="cCpu"><div class="label">CPU <span id="cpuInfo" class="aside"></span></div><div class="value"></div><div class="sub"></div></div>
    <div class="card" id="cMem"><div class="label">Memory <span id="memTotal" class="aside"></span></div><div class="value"></div><div class="sub"></div></div>
    <div class="card" id="cConn"><div class="label">Connections</div><div class="value"></div><div class="sub"></div></div>
    <div class="card" id="cDhcp"><div class="label">DHCP clients</div><div class="value"></div><div class="sub"></div></div>
  </div>

  <!-- WAN throughput graph, ports and Wi-Fi. -->
  <div id="middle">
    <div class="card" id="cGraph">
      <div class="label">Throughput <span id="wanDev"></span></div>
      <div id="scale"></div>
      <div id="rates"><span class="down" id="rateDown"></span><span class="up" id="rateUp"></span></div>
      <canvas id="graph" width="630" height="160"></canvas>
    </div>
    <div class="card" id="cTop"><div class="label">Top 10 <span id="topInfo" class="aside"></span><span class="hint">OK · routes</span></div><div class="rows"></div></div>
    <div id="side">
      <div class="card list" id="cPorts"><div class="label">Ports</div><div class="rows"></div></div>
      <div class="card list" id="cWifi"><div class="label">Wi-Fi <span id="wifiTotal"></span></div><div class="rows"></div></div>
    </div>
  </div>

  <div class="sectionLabel">WireGuard</div>
  <div id="wg"></div>

  <!-- Route editor: every static host and the tunnel it goes through (OK opens it). -->
  <div id="routes" class="hidden">
    <div class="label">Routes <span class="aside">which tunnel each static host uses</span></div>
    <div id="routesList"></div>
    <div id="routesMenu" class="hidden"></div>
    <div id="routesStatus"></div>
  </div>

  <script src="config.js"></script>
  <!-- token.js (gitignored) sets window.TV_TOKEN; without it the route editor stays locked. -->
  <script src="token.js"></script>
  <script src="app.js"></script>
</body>
</html>
